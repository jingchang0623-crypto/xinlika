name: Xinlika TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'xinlika-testflight-*'

permissions:
  contents: read

concurrency:
  group: xinlika-testflight
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/xinlika-apple.yml
  upload:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check signing inputs
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          WATCH_APPSTORE_PROFILE_BASE64: ${{ secrets.WATCH_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/prepare-apple-signing.py --check-inputs
      - name: Install XcodeGen
        run: |
          xcodebuild -version
          scripts/install-xcodegen-ci.sh
      - name: Archive, sign and upload iPhone with Watch
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          WATCH_APPSTORE_PROFILE_BASE64: ${{ secrets.WATCH_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: scripts/upload-testflight.sh
      - name: Save upload status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xinlika-testflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/testflight-status.txt
          include-hidden-files: true
          retention-days: 7
