name: Xinlika iPhone and Watch checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.11'
      - name: Install Apple build and audio tools
        run: |
          xcodebuild -version
          brew install ffmpeg
          scripts/install-xcodegen-ci.sh
      - name: Install pinned test dependencies
        run: scripts/setup-dev.sh
      - name: Core checks and unsigned iPhone with embedded Watch build
        run: scripts/check-project.sh --apple
      - name: iPhone simulator unit and UI tests
        run: scripts/check-apple-simulator.sh
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xinlika-apple-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/checks/
            .build/ci-simulator.xcresult/
          include-hidden-files: true
          retention-days: 7
